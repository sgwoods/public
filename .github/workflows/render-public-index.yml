name: Render Public Index

on:
  push:
    branches:
      - main
    # Every versioned file is a catalog input, including docs and legacy assets.
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

concurrency:
  group: render-public-index-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  render-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Observe repositories and refresh coordination pages
        id: refresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/refresh_public_coordination.py --observe

      - name: Set up Node for shared page freshness checks
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate freshness logic and generated pages
        if: steps.refresh.outcome == 'success'
        run: |
          python3 tools/test_repository_freshness.py
          python3 tools/test_activity.py
          python3 tools/test_working_activity.py
          python3 tools/test_private_status.py
          python3 tools/test_mac_bootstrap.py
          python3 tools/test_archive_capture.py
          python3 tools/check_archive_coverage.py --check
          node --test tools/test_project_freshness.cjs tools/test_public_index.cjs
          python3 tools/refresh_public_coordination.py --check

      - name: Test content inventory contract
        run: |
          python3 -m pip install -r tools/requirements-content-tests.txt
          python3 tools/test_content_inventory.py

      - name: Commit regenerated index
        run: |
          if git diff --quiet -- index.html PROJECT-SUITE-OVERVIEW.md project-suite-overview.html data/shared/repository-observations.json data/shared/repository-activity.json data/projects star-swarm.html confidential-project.html financial-planner.html woods-financial-dashboard.html; then
            echo "No index changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html PROJECT-SUITE-OVERVIEW.md project-suite-overview.html data/shared/repository-observations.json data/shared/repository-activity.json data/projects star-swarm.html confidential-project.html financial-planner.html woods-financial-dashboard.html
          git commit -m "Refresh public repository observations and coordination pages"
          git push

      - name: Refresh content inventory after committed observations
        run: |
          python3 tools/content_inventory.py build
          python3 tools/content_inventory.py check --schema
          if git diff --quiet -- data/content/catalog.json data/content/artifacts.jsonl data/content/sources.json data/content/update-requests.json CONTENT-INVENTORY.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content/catalog.json data/content/artifacts.jsonl data/content/sources.json data/content/update-requests.json CONTENT-INVENTORY.md
          git commit -m "Refresh public content discovery inventory"
          git push

      - name: Publish refreshed pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Report failed observation or rendering
        if: steps.refresh.outcome == 'failure'
        run: exit 1
