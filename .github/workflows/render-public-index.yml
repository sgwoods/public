name: Render Public Index

on:
  push:
    branches:
      - main
    paths:
      - "data/projects/*.json"
      - "*/project-manifest.json"
      - "assets/public-index.js"
      - "assets/public-site.css"
      - "tools/render_index.py"
      - "tools/render_project_suite_overview.py"
      - "tools/refresh_public_coordination.py"
      - "tools/check_repository_freshness.py"
      - "tools/test_repository_freshness.py"
      - "tools/archive_provenance.py"
      - "tools/snapshot_archive_provenance.py"
      - "tools/sync_external_status.py"
      - "tools/render_external_project.py"
      - "data/shared/project-suite-overview.json"
      - ".github/workflows/render-public-index.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

concurrency:
  group: render-public-index-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  render-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Observe repositories and refresh coordination pages
        id: refresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/refresh_public_coordination.py --observe

      - name: Validate freshness logic and generated pages
        if: steps.refresh.outcome == 'success'
        run: |
          python3 tools/test_repository_freshness.py
          python3 tools/refresh_public_coordination.py --check

      - name: Commit regenerated index
        run: |
          if git diff --quiet -- index.html PROJECT-SUITE-OVERVIEW.md project-suite-overview.html data/shared/repository-observations.json data/projects star-swarm.html; then
            echo "No index changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html PROJECT-SUITE-OVERVIEW.md project-suite-overview.html data/shared/repository-observations.json data/projects star-swarm.html
          git commit -m "Refresh public repository observations and coordination pages"
          git push

      - name: Publish refreshed pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Report failed observation or rendering
        if: steps.refresh.outcome == 'failure'
        run: exit 1
